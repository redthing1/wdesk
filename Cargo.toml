[package]
name = "wdesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A small Windows desktop for agents and people"
license = "MIT"
repository = "https://github.com/redthing1/wdesk"
exclude = ["notes/**", ".artifacts/**", "*.iso", "*.qcow2", "*.partial", "windows-client.json", "desktop.png"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
